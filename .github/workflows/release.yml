name: Publish package

on:
  push:
    tags:
      - "aereo-search-aws-goes-v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Build package
        run: |
          uv build --project projects/aereo-search-aws-goes --out-dir projects/aereo-search-aws-goes/dist
          ls -la projects/aereo-search-aws-goes/dist || true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: projects/aereo-search-aws-goes/dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: projects/aereo-search-aws-goes/dist/*
          generate_release_notes: true
