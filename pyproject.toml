[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aereo-search-aws-goes-workspace"
version = "1.0.0"
description = "A plugin repository for the AWS GOES aereo search component"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["satellite", "remote-sensing", "earth-observation", "aereo", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
authors = [{ name = "Fran Dorr" }]
dependencies = [
    "aereo>=1.1,<2.0",
    "geopandas>=1.1.2",
    "pandera[geopandas]>=0.24.0",
    "pyresample>=1.35.0",
    "s3fs>=2026.2.0,<2027.0.0",
]

[project.entry-points."aereo.plugins"]
search_aws_goes = "aereo.search_aws_goes.core:SearchAwsGoes"

[project.urls]
Homepage = "https://github.com/frandorr/aereo-search-aws-goes"
Repository = "https://github.com/frandorr/aereo-search-aws-goes"
Issues = "https://github.com/frandorr/aereo-search-aws-goes/issues"
Documentation = "https://frandorr.github.io/aereo-search-aws-goes"

[tool.uv]
managed = true

[tool.uv.sources]
aereo = { path = "../aereo/projects/aereo", editable = true }

[tool.uv.workspace]
members = ["projects/*"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]

[tool.ruff]
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".ruff_cache",
    "dist",
    ".venv",
    "./development/*.py",
]
line-length = 120

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["components/", "bases/"]

[dependency-groups]
dev = [
    "majortom-eg>=1.0.0,<2.0.0",
    "marimo[mcp]>=0.21.1,<0.22.0",
    "polylith-cli>=1.43.0,<2.0.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=6",
    "python-semantic-release>=10.5.3,<11.0.0",
]

[tool.polylith]
bricks."components/aereo/search_aws_goes" = "aereo/search_aws_goes"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
[tool.coverage]
run.branch = true
run.source = [ "components" ]
run.omit = [
  "*/test*",
  "*/__pycache__/*",
  "*/.venv/*",
  "*/site/*",
  "*/dist/*",
  "*/build/*",
  "*/development/*",
]
report.show_missing = true
report.skip_covered = false
report.fail_under = 0
report.exclude_also = [
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
html.directory = "htmlcov"
