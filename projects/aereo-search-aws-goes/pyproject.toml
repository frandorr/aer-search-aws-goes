[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "aereo-search-aws-goes"
version = "1.0.0"
description = "Polylith project for the search-aws-goes plugin"
readme = "README.md"
license = "Apache-2.0"
keywords = ["satellite", "remote-sensing", "earth-observation", "aereo", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
authors = [{ name = "Fran Dorr" }]

requires-python = ">=3.12"

dependencies = [
    "aereo",
    "geopandas>=1.1.2,<2.0.0",
    "pandera[geopandas]>=0.24.0,<0.25.0",
    "pyresample>=1.35.0",
    "s3fs>=2026.2.0,<2027.0.0",
]

[project.urls]
Homepage = "https://github.com/frandorr/aereo-search-aws-goes"
Issues = "https://github.com/frandorr/aereo-search-aws-goes/issues"
Repository = "https://github.com/frandorr/aereo-search-aws-goes"
Documentation = "https://frandorr.github.io/aereo-search-aws-goes"

[project.entry-points."aereo.plugins"]
search_aws_goes = "aereo.search_aws_goes.core:search_aws_goes"

[tool.hatch]
build.dev-mode-dirs = [ "../../components", "../../bases", "../../development", "." ]
build.hooks.polylith-bricks = {}
build.targets.wheel.packages = ["aereo"]

[tool.polylith]
bricks."../../components/aereo/search_aws_goes" = "aereo/search_aws_goes"
